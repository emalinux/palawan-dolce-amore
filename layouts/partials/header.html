<!-- TEST HEADER: SE VEDI QUESTA SCRITTA, STAI USANDO QUESTO HEADER -->

<header class="site-header">
  <div class="site-header-inner">

    <div class="site-title">
      <a href="{{ "/" | relLangURL }}">
        <span class="site-title-line1">Palawan Dolce Amore</span><br>
        <span class="site-title-line2">Tribe Association</span>
      </a>
    </div>

    <nav class="site-nav" aria-label="Main navigation">
      {{ $currentPage := . }}
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}"
           class="{{ if $currentPage.IsMenuCurrent "main" . }}is-active{{ end }}">
          {{ .Name }}
        </a>
      {{ end }}
    </nav>

    <div class="lang-switcher">
      {{ if eq .Site.Language.Lang "it" }}
        <a href="{{ .Site.Home.RelPermalink | relLangURL "en" }}">
          <img src="/images/flags/uk.png" alt="English" />
        </a>
        <img src="/images/flags/it.png" alt="Italiano" class="is-active" />
      {{ else }}
        <img src="/images/flags/uk.png" alt="English" class="is-active" />
        <a href="{{ .Site.Home.RelPermalink | relLangURL "it" }}">
          <img src="/images/flags/it.png" alt="Italiano" />
        </a>
      {{ end }}
    </div>

  </div>
</header>
